<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 💕</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Nunito', sans-serif;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            color: #ff4757;
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
            font-weight: 800;
        }

        .gif-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 107, 129, 0.4);
            border: 5px solid white;
            margin-bottom: 25px;
            display: inline-block;
        }

        .gif-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .quote-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin-top: 10px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.03);
            border-left: 5px solid #ff6b81;
        }

        .quote {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #576574;
            line-height: 1.4;
            margin: 0;
        }

        .signature {
            font-size: 1.2rem;
            color: #ff4757;
            font-weight: 800;
            margin-top: 15px;
            text-align: right;
            font-style: italic;
        }

        /* Confetti animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 5s linear infinite;
            z-index: -1;
        }

        .c1 {
            background-color: #ff4757;
            left: 10%;
            animation-duration: 4s;
        }

        .c2 {
            background-color: #2ed573;
            left: 30%;
            animation-duration: 5s;
            animation-delay: 1s;
        }

        .c3 {
            background-color: #1e90ff;
            left: 50%;
            animation-duration: 3s;
            animation-delay: 2s;
        }

        .c4 {
            background-color: #ffa502;
            left: 70%;
            animation-duration: 6s;
            animation-delay: 0.5s;
        }

        .c5 {
            background-color: #ff6b81;
            left: 90%;
            animation-duration: 4.5s;
            animation-delay: 1.5s;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            .card {
                padding: 30px 20px;
                box-sizing: border-box;
            }
            .quote {
                font-size: 1.4rem;
            }
            .signature {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>

    <div class="card">
        <h1>You said Yes! 🥰💍</h1>

        <div class="gif-container">
            <img src="./proposal.jpg" alt="Beautiful romantic proposal" style="max-width: 100%; max-height: 400px; object-fit: cover;">
        </div>

        <div class="quote-box">
            <p class="quote">"I choose you. And I'll choose you over and over and over. Without pause, without a doubt, in a heartbeat. I'll keep choosing you for the rest of my life."
            </p>
            <div class="signature">~ Yours Forever</div>
        </div>
    </div>

</body>

</html>
